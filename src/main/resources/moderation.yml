  Staff_Mode:
    Vanish_On_Enter: true
    Allow_Flight: true

# -------------------------------------------------------------------------------------
#  Warning points: each infraction (a rule with Points) adds points; crossing a threshold
#  runs console commands. {player} and {points} are substituted.
# -------------------------------------------------------------------------------------
Warning_Points:
  Enabled: true
  # After this time without new infractions, the player's points reset.
  # Formats: 10m, 2h, 1d, 1w, or "perm" to never decay.
  Decay_After: 1d
  # Points added by a manual /warn from staff (0 = warns notify and record, but add none).
  Manual_Warn_Points: 1
  Thresholds:
    3:
      - "mute {player} 10m Too many chat infractions"
    5:
      - "kick {player} Repeated chat infractions"

# -------------------------------------------------------------------------------------
#  Staff security: audita usos de comandos sensibles por parte del staff y los refleja
#  en la consola y en el canal privado del bot de Discord si esta activo.
#  Esto no bloquea por si solo; deja trazabilidad clara de acciones criticas.
# -------------------------------------------------------------------------------------
Staff_Security:
  Enabled: false
  Audit_Commands: true
  Commands:
    - "/spy"
    - "/staffchat"
    - "/mute"
    - "/unmute"
    - "/staff"
    - "/kick"
    - "/ban"
    - "/tempban"
    - "/unban"
    - "/freeze"
    - "/unfreeze"
    - "/vanish"
    - "/reports"
    - "/report"
    - "/nick"
    - "/formatedit"
    - "/clearchat"
    - "/chatlock"
    - "/chatunlock"
    - "/slowmode"
    - "/players"
    - "/chatalyst"
    - "/warnings"

# -------------------------------------------------------------------------------------
#  Audit logging (on by default). Chat, commands, PMs, mail and edited content use
#  independent switches and rotate into plugins/Chatalyst/logs/chat-YYYY-MM-DD.log. Rules
#  with Actions.Audit also write explicit RULE entries. Credential commands are never
#  recorded. Use /chatlog [player] [count] to review recent history in game.
# -------------------------------------------------------------------------------------
Log:
  Enabled: true
  Chat: true
  Commands: true
  Private_Messages: true
  Mail: true
  Signs: true
  Books: true
  Anvil: true
  # Container & mechanism interactions (opens, place/break, levers...) with coordinates.
  Containers: true
  # PvP: who opens each fight and who kills whom. This is what makes a "first punch"
  # rule arbitrable at all (see Spy.Combat in players.yml).
  Combat: true
  # Real name -> alias mapping when a player enters /anonymous. The ONLY record of who is
  # behind a disguise (console and chat only ever see the alias), so staff can investigate
  # later without unmasking them live. Turn off for zero trace.
  Anonymous: true
  # What the swear filter censored or blocked, recorded WITH the original text: the regular
  # CHAT entry only sees the censored version, and blocked content never reaches it at all.
  Swear: true
  # Messages relayed from Discord into the game chat (already filtered).
  Discord: true
  # Delete daily log files older than this many days. 0 = keep them forever.
  Keep_Days: 30
  # Commands that are NEVER logged (they contain passwords or other sensitive data).
  Ignore_Commands:
    - "/login"
    - "/register"
    - "/l"
    - "/reg"
    - "/changepassword"
    - "/cp"
    - "/2fa"

# -------------------------------------------------------------------------------------
#  Reports (/report <player> <reason>): players report others; online staff with the
#  Notify_Permission get the alert. Per-player cooldown prevents report spam.
# -------------------------------------------------------------------------------------
Reports:
  Enabled: true
  Cooldown: 60
  # Limites persistentes (code points Unicode); evitan tickets gigantes en YAML/MySQL/Discord.
  Max_Reason_Length: 512
  Max_Reply_Length: 512
  Max_Note_Length: 512
  Notify_Permission: chatalyst.report.receive
  # true = staff sees report notifications in their own client language.
  # false = use Format exactly as written for everyone.
  Use_Player_Language: true
  # Soft sound for online staff when a new report arrives.
  Notify_Sound:
    Enabled: true
    Key: "minecraft:block.note_block.chime"
    Volume: 0.65
    Pitch: 1.25
  # Priority (critical) reports — item deletion, rank removal, etc. Only staff with this
  # permission see, receive and handle them (give it to owner/admin/senior admin ranks).
  # Staff mark a ticket critical with /reports priority <id> or the GUI button.
  Priority_Permission: chatalyst.report.priority
  # Deleting tickets. Allow_Delete turns it on/off. Delete_High_Rank_Only decides WHO can
  # delete: true = only high rank (Priority_Permission, the safe default), false = normal
  # support staff (Manage_Permission) too. Staff without clearance are told they can't
  # delete the ticket unless a higher-rank staff member does it.
  Allow_Delete: true
  Delete_High_Rank_Only: true
  Manage_Permission: chatalyst.report.manage
  Format: "<#7B68A0>[<#FF4D6D>Report #{id}<#7B68A0>] <#E0AAFF>{reporter} <#C0B3D9>reported <#E0AAFF>{target}<#C0B3D9>: <#FBF2FF>{reason}"

# -------------------------------------------------------------------------------------
#  Item watch: alerts staff about suspicious items — possible dupes or exploits.
#  It ONLY ALERTS (never removes anything): staff get a message with a click to open the
#  player's inventory, plus the console and the Discord staff channel.
#  Looks at the inventory, the ender chest, PlayerVaults backpacks (if installed) and any
#  chest/barrel/shulker a player opens. Items inside shulkers and bundles count too.
#  Each rule:
#    Items: materials to count. MATERIAL*N counts each one as N (DIAMOND_BLOCK*9 = 9
#           diamonds), so storing in blocks does not dodge the rule.
#    Name_Contains / Lore_Contains: only items whose name/lore contains one of these texts
#           (crate keys, custom items). Without Items, any material with that name counts.
#    Max: alert when the total reaches this. 0 = no limit.
#    Gain + Gain_Window_Minutes: alert when the total grows this much within the window.
#  Detect_Overstack: stacks above the vanilla maximum (64 swords in one slot) — a classic
#  dupe/hacked-client mark. Players with chatalyst.itemwatch.bypass are never watched.
#  Alerts go to chatalyst.itemwatch.alerts; /itemwatch scan <player> shows the counts now.
# -------------------------------------------------------------------------------------
Item_Watch:
  Enabled: false
  Scan_Interval_Seconds: 60
  Alert_Cooldown_Minutes: 10
  Alert_Permission: chatalyst.itemwatch.alerts
  Bypass_Permission: chatalyst.itemwatch.bypass
  Ignore_Creative: true
  Notify_Discord: true
  Scan_Ender_Chest: true
  Scan_Vaults: true
  Scan_Containers: true
  Detect_Overstack: true
  Rules:
    - Id: diamonds
      Name: Diamonds
      Items: [DIAMOND, DIAMOND_BLOCK*9, DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
      Max: 1280
      Gain: 640
      Gain_Window_Minutes: 10
    - Id: netherite
      Name: Netherite
      Items: [NETHERITE_INGOT, NETHERITE_BLOCK*9, ANCIENT_DEBRIS, NETHERITE_SCRAP]
      Max: 128
      Gain: 64
      Gain_Window_Minutes: 10
    - Id: emeralds
      Name: Emeralds
      Items: [EMERALD, EMERALD_BLOCK*9]
      Max: 3000
      Gain: 1500
      Gain_Window_Minutes: 10
    - Id: gold
      Name: Gold
      Items: [GOLD_INGOT, GOLD_BLOCK*9, RAW_GOLD, RAW_GOLD_BLOCK*9]
      Max: 6000
      Gain: 3000
      Gain_Window_Minutes: 10
    - Id: god-apples
      Name: Enchanted golden apples
      Items: [ENCHANTED_GOLDEN_APPLE]
      Max: 32
      Gain: 16
      Gain_Window_Minutes: 10
    - Id: totems
      Name: Totems
      Items: [TOTEM_OF_UNDYING]
      Max: 24
      Gain: 12
      Gain_Window_Minutes: 10
    - Id: elytra
      Name: Elytra
      Items: [ELYTRA]
      Max: 4
    - Id: rare-blocks
      Name: Beacons, spawners and dragon eggs
      Items: [BEACON, SPAWNER, DRAGON_EGG, NETHER_STAR]
      Max: 12
      Gain: 6
      Gain_Window_Minutes: 10
    - Id: crate-keys
      Name: Crate keys
      Name_Contains: [Key, Llave]
      Max: 64
      Gain: 32
      Gain_Window_Minutes: 10

# -------------------------------------------------------------------------------------
#  Command cooldowns: make players wait between uses of certain commands (anti-spam for
#  commands like /kit, /home, /rtp...). Bypassable with the permission below.
# -------------------------------------------------------------------------------------
Command_Cooldowns:
  Bypass_Permission: chatalyst.bypass.cooldown
  Commands: {}

# -------------------------------------------------------------------------------------
#  Autoclick detector: alerts staff about players whose left clicks look machine-made.
#  It ONLY ALERTS and keeps a record (daily log, /check history, Discord staff channel);
#  it never punishes on its own unless you fill Punishment.Commands below.
#  Two independent signals, each with its own thresholds:
#    Regularity: many clicks in a row, held for a long time, with almost identical gaps
#                between them. Humans cannot keep that up; a fixed-rate clicker can't hide it.
#    Speed:      an average CPS above Max_Cps for several seconds in a row.
#  Plus Long_Session: slightly looser regularity kept up for many minutes (AFK farms that
#  hit a mob with the same rhythm for ten minutes), caught even at a low CPS.
#  Known false positives are handled: clicks while digging a block (holding the button
#  swings the arm every tick at a perfect rhythm), right-click/drop swings, creative mode,
#  low TPS and high ping (no alert under lag), and Bedrock players (excluded by default).
#  With PacketEvents installed clicks are timed when the packet ARRIVES (~1 ms resolution);
#  without it, server events are used (up to one tick of error under load).
#  Permissions: chatalyst.autoclick.alerts (receive alerts), chatalyst.autoclick.bypass
#  (never analysed), chatalyst.command.autoclick (/autoclick [player], alias /cps).
# -------------------------------------------------------------------------------------
Autoclick:
  Enabled: false
  # auto = PacketEvents packets when installed, otherwise server events.
  # packets = require PacketEvents (falls back to events with a warning). events = never packets.
  Source: auto
  # A pause longer than this ends the click streak and everything starts again.
  Max_Gap_Millis: 2500
  # At most one alert per player every this many seconds (staff chat stays readable).
  Alert_Cooldown_Seconds: 60
  # Also send each alert to the Discord staff channel (if configured).
  Notify_Discord: true
  # Add a row to the player's /check history (at most one every History_Cooldown_Minutes,
  # so a long session of alerts never pushes real bans out of the capped history).
  # Every single alert is also written to the daily log (logs/chat-*.log, type AUTOCLICK).
  Record_History: true
  History_Cooldown_Minutes: 30
  # Players in creative/spectator are never alerted.
  Ignore_Creative: true
  # How long /autoclick <player> shows the live CPS and regularity on the action bar.
  Live_Seconds: 15
  # /autoclick with no arguments lists the players alerted within this many minutes.
  Recent_Minutes: 60
  # No alert while the server or the player lags: delayed packets arrive in bursts.
  Lag:
    Min_Tps: 18.0
    Max_Ping_Millis: 250
  Regularity:
    # Minimum clicks in the streak and minimum streak length before judging it.
    Min_Clicks: 40
    Min_Duration_Seconds: 15
    # Most recent gaps measured (must be at least Min_Clicks - 1).
    Window: 100
    # Alert when (standard deviation / mean) of the gaps is at or below this AND the
    # standard deviation is at or below Max_Std_Millis. Humans sit around 0.15-0.40.
    Max_Deviation: 0.08
    Max_Std_Millis: 12
    # Also alert when the gaps take at most this many different values (rounded to 1 ms).
    # Only used with PacketEvents (event timing is too coarse). 0 = off.
    Max_Distinct_Intervals: 5
  Speed:
    # Alert when the average CPS stays at or above Max_Cps for this many seconds in a row
    # (and no single second drops below half of it). 0 seconds = off.
    Max_Cps: 16
    Seconds: 5
  Long_Session:
    # Alert when the click rhythm stays this regular for this many minutes without a
    # pause longer than Max_Gap_Millis. 0 minutes = off.
    Minutes: 10
    Max_Deviation: 0.12
    Max_Std_Millis: 25
  # Bedrock players (Floodgate) click differently (touch, controller) and Geyser delivers
  # their clicks rounded to ticks, so they get their own thresholds. Any Regularity, Speed
  # or Long_Session key can be repeated here; missing ones are taken from above.
  Bedrock:
    Analyze: false
    Max_Ping_Millis: 350
    Speed:
      Max_Cps: 20
  # Optional automatic action, run from the console when a player collects After_Alerts
  # alerts within Window_Minutes. Empty by default: staff decide. {player} and {uuid}
  # are replaced. Example: - "kick {player} Autoclicker detected"
  Punishment:
    After_Alerts: 3
    Window_Minutes: 30
    Commands: []

# -------------------------------------------------------------------------------------
#  Anti-exploit (2026-10-03). Paper ya limita los paquetes en GLOBAL, el tamano de los
#  libros y el spam de recetas/autocompletado; esto limita POR TIPO lo que usan los
#  clientes de crasheo (inundar un paquete caro) y frena objetos "bomba" en creativo.
#    Packets: nombre de PacketEvents -> Max_Per_Second y Max_Bytes (0 = sin limite).
#      "TIPO: false" lo deja sin vigilar. Los que no se pongan usan los de fabrica.
#      Un paquete por encima del limite se DESCARTA; con Kick_After_Drops descartes en
#      10 s (o un paquete 4 veces mayor que Max_Bytes) se EXPULSA al jugador.
#    Exempt_Bedrock: Geyser manda los paquetes a su manera; mejor no juzgarlos.
#    Items: objetos puestos en creativo (tamano serializado, encantamientos, monton).
#  Avisos: staff con Alerts_Permission, consola, log (ANTIEXPLOIT) y Discord del staff.
# -------------------------------------------------------------------------------------
Anti_Exploit:
  Enabled: true
  Bypass_Permission: chatalyst.antiexploit.bypass
  Alerts_Permission: chatalyst.antiexploit.alerts
  Notify_Discord: true
  Alert_Cooldown_Seconds: 10
  Exempt_Bedrock: true
  Kick_After_Drops: 40
  Packets:
    PLUGIN_MESSAGE: {Max_Per_Second: 60, Max_Bytes: 32768}
    EDIT_BOOK: {Max_Per_Second: 5, Max_Bytes: 65536}
    CREATIVE_INVENTORY_ACTION: {Max_Per_Second: 120, Max_Bytes: 65536}
    CLICK_WINDOW: {Max_Per_Second: 250, Max_Bytes: 65536}
    TAB_COMPLETE: {Max_Per_Second: 15, Max_Bytes: 4096}
    UPDATE_SIGN: {Max_Per_Second: 8, Max_Bytes: 4096}
    NAME_ITEM: {Max_Per_Second: 20, Max_Bytes: 1024}
    CUSTOM_CLICK_ACTION: {Max_Per_Second: 15, Max_Bytes: 32768}
  Items:
    Enabled: true
    Max_Creative_Item_Bytes: 16384
    Max_Enchant_Level: 10
    Block_Over_Stacked: true
    # Estructura del objeto. 0 = sin limite.
    # Niveles de objetos dentro de objetos (bolsa en caja en bolsa...): las "matrioskas" cuelgan servidores.
    Max_Nested_Items: 5
    # Objetos en total dentro de uno solo.
    Max_Items_Inside: 1728
    # Elementos NBT del objeto: miles de datos diminutos pesan poco pero cuestan mucho de leer.
    Max_Nbt_Elements: 4096
    # Profundidad maxima de los datos NBT.
    Max_Nbt_Depth: 48
  Signs:
    Max_Line_Length: 96
  # Libros al firmar o guardar: los limites del propio juego.
  Books:
    Max_Pages: 100
    Max_Page_Chars: 1024
  # Suma de TODOS los paquetes de una conexion, tambien en login y configuracion, antes de
  # que exista el jugador. Lo que pasa del limite se descarta; tras Kick_After_Seconds segundos
  # seguidos por encima se corta la conexion. Un pico suelto no expulsa a nadie. 0 = sin limite.
  Connection:
    Max_Packets_Per_Second: 2000
    Max_Bytes_Per_Second: 2097152
    Kick_After_Seconds: 3
  # Corchetes anidados en comandos y autocompletado: desbordan el analizador del servidor.
  Commands:
    Max_Nesting: 32
  # Canales de plugin: maximo distinto registrado por jugador (Paper ya corta en 128; pasarse solo
  # avisa) y largo maximo de un nombre de canal (pasarse expulsa: ningun cliente real lo hace).
  Channels:
    Max_Registered: 128
    Max_Name_Length: 128
  # Reincidentes: a la N-esima expulsion en la ventana se ejecuta Ban_Command por consola.
  # Ban_After_Kicks: 0 lo apaga. Con prefijo chatalyst: para que no lo coja otro plugin.
  Escalation:
    Ban_After_Kicks: 3
    Window_Minutes: 30
    Ban_Command: "chatalyst:tempban {player} 1h Anti-exploit: paquetes maliciosos repetidos"
