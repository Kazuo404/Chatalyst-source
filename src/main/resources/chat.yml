# =====================================================================================
#  Chatalyst — chat: formatting, channels, routing, mentions, grammar, /me & /say.
# =====================================================================================

Chat:
  # {rank_chat}: the rank tag ANIMATED inside chat (Minecraft 1.21.9+ sprites that the client animates).
  # Groups maps a LuckPerms group to the MiniMessage sprites of its tag; groups not listed, or any viewer
  # on Bedrock, get the fixed {player_prefix}. Generated by a tool, not written by hand.
  Rank_Tags:
    Enabled: false
    Groups: {}
  # Enable or disable Chatalyst chat formatting.
  Enabled: true

  # What clicking a player name in chat suggests ({msg_command} in the formats):
  #   mail = /inbox send <player>  (works even with private messages disabled; default)
  #   msg  = /msg <player>         (only when Private_Messages.Enabled is true;
  #                                 falls back to mail otherwise)
  Name_Click_Prefer: mail

  # Name of the file (without .yml) inside formats/ used by default.
  Default_Format: chat

  # Make URLs in chat clickable. Only players with chatalyst.chat.links (staff by default)
  # get clickable links, to avoid phishing spam from regular players.
  Clickable_Links: true

  # Players can type [item] (or [i]) in chat to show the item they are holding, with its
  # full tooltip on hover. Controlled by the chatalyst.chat.item permission (default true).
  Item_Placeholder: true
  # If the held item is from Nexo or ItemsAdder, append its custom id in the [item] tag.
  # This helps staff/store owners verify custom items directly from chat.
  Item_Custom_Ids: true

  # Players can type [inv] (or [inventory]/[inventario]) and [ec] (or [enderchest]) in chat
  # to share a live, read-only view of their inventory or ender chest: everyone sees an
  # "Open" button for 5 minutes. Shulkers inside open with a click. Controlled by the
  # chatalyst.chat.shareinv permission (default true).
  Inventory_Share: true

  # Pixel-style chat tokens. Players can type [creeper], :heart:, [star], etc.
  # Each token renders as a small styled label with an item/head hover preview.
  # Controlled by chatalyst.chat.pixel (default true).
  Pixel_Images:
    Enabled: true
    Tokens:
      creeper:
        Material: CREEPER_HEAD
        Display: "<#7B68A0>[<#3DFFA8>Creeper<#7B68A0>]"
        Hover: "<#3DFFA8>Creeper Head"
      zombie:
        Material: ZOMBIE_HEAD
        Display: "<#7B68A0>[<dark_green>Zombie<#7B68A0>]"
        Hover: "<dark_green>Zombie Head"
      skeleton:
        Material: SKELETON_SKULL
        Display: "<#7B68A0>[<#FBF2FF>Skeleton<#7B68A0>]"
        Hover: "<#FBF2FF>Skeleton Skull"
      diamond:
        Material: DIAMOND
        Display: "<#B56CFF>[Diamond]"
        Hover: "<#B56CFF>Diamond"
      emerald:
        Material: EMERALD
        Display: "<#3DFFA8>[Emerald]"
        Hover: "<#3DFFA8>Emerald"
      sword:
        Material: DIAMOND_SWORD
        Display: "<#FBF2FF>[Sword]"
        Hover: "<#FBF2FF>Diamond Sword"
      tnt:
        Material: TNT
        Display: "<#FF4D6D>[TNT]"
        Hover: "<#FF4D6D>TNT"

  # Emojis: players type :name: and it becomes a Unicode symbol the Minecraft font draws
  # (❤ ★ ➤ ♪ ☀ ✓ ...). See the full list of built-in names with /chatalyst help or the docs.
  # Color emoji pictures don't render in vanilla — use ItemsAdder for those. Add your
  # own or override built-ins under Custom (name: symbol). Permission: chatalyst.chat.emoji.
  Emojis:
    Enabled: true
    Custom:
      shrug: "¯\\_(ツ)_/¯"
      tableflip: "(╯°□°）╯︵ ┻━┻"

  # How {party_tag} looks in chat formats when the player is in a party (Parties plugin).
  # {party} is the party name. Players without a party show nothing. Result:
  # [RANK] [PARTY] [NICK] message
  Party_Tag: "<#7B68A0>[<#B56CFF>{party}<#7B68A0>] "

  # /clearchat pushes old chat out of view with blank lines (there is no client-side clear
  # in Minecraft). Raise this if players can still scroll up and read old messages. Staff
  # with chatalyst.command.clearchat.bypass keep their chat so they can review it.
  Clear_Lines: 150

  # /ignore <player> also hides that player's PUBLIC chat, not just their private messages.
  # With Hide_In_Chat on, an ignored player's messages collapse to a small "[ignored] name ·
  # [show]" marker; clicking [show] reveals just that one message to you (you stay ignoring
  # them). Turn this off to keep /ignore affecting private messages only.
  Ignore:
    Hide_In_Chat: true

# -------------------------------------------------------------------------------------
#  Chat channels
#  Each player writes in one channel (default "global") and sees the ones they can read.
#  Switch channel: /channel <name>. Hide one: /channel mute <name>.
#
#  Per-channel fields:
#    Enabled      false = completely hidden from commands, router, tab-completion and GUI.
#    Auto_Enable_With_Market_Plugins  allows a disabled trade/auction channel to appear
#                 temporarily when a compatible external marketplace needs it.
#    Aliases      Short names for /channel.
#    Type         GLOBAL (everyone), WORLD (same world), FREQUENCY (local chat by radio:
#                 same tuned frequency, any distance), REGION (shared WorldGuard region),
#                 PARTY (same Parties party).
#    Permission   Empty = anyone. If set, this permission is required to read/write.
#    Format       Format (formats/<x>.yml) this channel uses.
#    Auto_Listen  true = heard without joining; false = only when it's your active channel.
# -------------------------------------------------------------------------------------
Channels:
  Enabled: true
  Default: global
  # Channel players WRITE in when they join the server:
  #   default = everyone starts back in the default channel (the general chat)
  #   last    = remember the channel they were using when they left
  On_Join: default
  # Real, separate channels: besides the DEFAULT channel (always audible unless muted
  # with /channel mute), you only receive the channel you are writing in. Being in
  # global hides trade/auction/etc. (catch up with the history replay or
  # /channel history <name>). Exceptions: channels with Force_Listen: true (staff),
  # /channel listen subscriptions, and players with chatalyst.channel.seeall.
  # Set to false to go back to overlapping channels (Auto_Listen behavior).
  Exclusive: true
  # Rolling in-memory history per GLOBAL channel. When a player switches channels they
  # get the last messages replayed, clearly marked as already sent ("[3m] Name » ...");
  # /channel history [name] shows it on demand. Frequency/world/region/party channels are
  # never recorded because replaying them could leak messages the viewer was not meant to see.
  History:
    Enabled: true
    Size: 20               # messages kept per channel
    Show_On_Switch: 10     # replayed on /channel <name> (0 = only via /channel history)
    Retention_Minutes: 30  # older entries are dropped
  # Radio frequency for FREQUENCY-type channels (the local chat). Empty means OFF: players
  # hear and use the radio only after tuning in with /frequency. Set a value such as "10.00"
  # if every new player should start on the same frequency. Range is fixed 10.00–99.99.
  Frequency:
    Default: ""
  List:
    global:
      Aliases: [g, global]
      Type: GLOBAL
      Permission: ""
      Format: chat
      Auto_Listen: true
      # Proxy: true forwards this channel across the whole network (needs Proxy.Enabled below).
      Proxy: false
    # Local chat by RADIO FREQUENCY: instead of a block radius, each player tunes a
    # frequency (NN.NN, 10.00–99.99) with /frequency and only hears others on the SAME
    # frequency — no distance limit. It starts DISABLED (no default frequency), so nobody
    # is on the radio until they tune in. Use /f <message> to speak on your frequency without
    # leaving your current channel, so you can use the radio and general chat at the same
    # time. Force_Listen keeps the radio always audible (filtered to your frequency).
    local:
      Aliases: [l, local]
      Type: FREQUENCY
      Permission: ""
      Format: chat
      Auto_Listen: true
      Force_Listen: true
    # Trade channel: buy/sell offers only. Aliases work in English and Spanish.
    # Proxy: true so offers reach the whole network (needs Proxy.Enabled below; harmless
    # on a single server). The Channel_Router below moves offers written in global here.
    trade:
      # Disabled by default. Enable it to show this channel in /channel and its GUI.
      Enabled: false
      Auto_Enable_With_Market_Plugins: true
      Aliases: [t, trade, sell, market, ventas, venta, vender]
      Type: GLOBAL
      Permission: ""
      Format: trade
      Auto_Listen: true
      Proxy: true
    # Auction channel: auction announcements and bids. Aliases in English and Spanish.
    auction:
      # Disabled by default. Enable it to show this channel in /channel and its GUI.
      Enabled: false
      Auto_Enable_With_Market_Plugins: true
      Aliases: [ah, auction, auc, subasta, subastas]
      Type: GLOBAL
      Permission: ""
      Format: auction
      Auto_Listen: true
      Proxy: true
    staff:
      Aliases: [s, sc, staff]
      Type: GLOBAL
      Permission: chatalyst.channel.staff
      Format: staff
      Auto_Listen: true
      # Staff must never miss staff messages, even with Channels.Exclusive on.
      Force_Listen: true
      # Required for support escalations and staff chat across Velocity/Bungee.
      Proxy: true
    # Region channel: only players sharing a WorldGuard region see each other.
    # Requires the WorldGuard plugin; without it, behaves like a normal channel.
    region:
      Aliases: [r, region, zone]
      Type: REGION
      Permission: ""
      Format: chat
      Auto_Listen: false
    # Party channel: only your party members see it (AlessioDP's Parties plugin).
    # Without Parties installed this channel is not loaded, so nothing private becomes public.
    party:
      Aliases: [p, party, group]
      Type: PARTY
      Permission: ""
      Format: chat
      Auto_Listen: false
    # Clan channel for ANY clan plugin: players with the same value of Group_Placeholder see
    # each other. Set it to your clan plugin's PlaceholderAPI placeholder and enable it. An
    # empty or unresolved value means "no clan": those players reach nobody.
    # Only GLOBAL channels cross servers: Proxy is ignored for every other type.
    clan:
      Enabled: false
      Aliases: [c, clan, team]
      Type: GROUP
      Group_Placeholder: "%clan_name%"
      Permission: ""
      Format: chat
      Auto_Listen: false

# -------------------------------------------------------------------------------------
#  Smart channel router: keeps the GLOBAL chat free of sale/auction spam. Messages that
#  match a rule are delivered in the target channel automatically (Action: move) or
#  cancelled with a hint (Action: block). Only affects players writing in the default
#  channel; staff with chatalyst.bypass.router are never routed. Rules are checked in
#  order and patterns are case-insensitive Java regexes (Spanish + English defaults).
# -------------------------------------------------------------------------------------
Channel_Router:
  Enabled: true
  Action: move           # move = deliver in the target channel · block = cancel + hint
  Notify: true           # tell the player their message was moved (at most once a minute)
  # One-off shortcuts: starting a message with the prefix sends it to that channel without
  # switching (player's explicit choice; the prefix is stripped). Example below.
  Shortcut_Prefixes: {}
  # Shortcut_Prefixes:
  #   "!": trade
  #   "?": auction
  Rules:
    auction:
      Patterns:
        - '\bsubast\w*'
        - '\bpuja(r|s|n|ndo)?\b'
        - '\bauction\w*'
        - '\b(bid|bids|bidding)\b'
    trade:
      Patterns:
        - '\b(vendo|vendemos|compro|compramos|revendo)\b'
        - '\bse\s+(vende|compra)n?\b'
        - '\ben\s+venta\b'
        - '\bbusco\s+(comprar|vender)\b'
        - '\b(wts|wtb|wtt)\b'
        - '\b(selling|buying)\b'
        - '\bfor\s+sale\b'
        - '\btrade(o|ando|ar|s|ing)?\b'

# /me format (third-person action). {message} = the action typed.
Me:
  Format: "<#C0B3D9>* <#FBF2FF>{player_name} <#C0B3D9>{message}"

# /say format (server message).
Say:
  Format: "<#7B68A0>[<#B56CFF>Server<#7B68A0>] <#E0AAFF>{message}"
  Format_es: "<#7B68A0>[<#B56CFF>Servidor<#7B68A0>] <#E0AAFF>{message}"

# -------------------------------------------------------------------------------------
#  Mentions: plays a sound to whoever is named in chat.
#    Require_At  true = only detect @name; false = also detect the bare name.
#    Sound       sound key (namespaced, valid in 1.21.1 - 26.2).
# -------------------------------------------------------------------------------------
Mentions:
  Enabled: true
  # Seconds between mention pings for the SAME mentioned player (0 = no cooldown).
  Cooldown_Seconds: 0
  Require_At: false
  Sound: "minecraft:block.note_block.pling"
  # Highlight the mentioned player's name in the chat (only they see their name highlighted).
  Highlight:
    Enabled: true
    Color: yellow
    Bold: true

    # Add your own below (a literal like "/warn" or a "regex:..." pattern):
    # - "/op"

# -------------------------------------------------------------------------------------
#  Grammar: soft corrections (disabled by default).
# -------------------------------------------------------------------------------------
Grammar:
  Enabled: false
  Capitalize: true       # capitalize the first letter
  Punctuation: true      # add a period at the end
  Min_Length: 4

# -------------------------------------------------------------------------------------
#  Tab-complete: hides commands from tab completion (TAB) so you don't reveal your version
#  or plugins. Entries can be an exact command ("version") or a namespace wildcard
#  ("minecraft:*") that hides every command in that namespace. Staff with the bypass
#  permission still see everything. Enable it and adjust the list to taste.
#
#  Mode decides which list is used:
#    hide       hide what is listed under Hide; everything else stays visible (default).
#    whitelist  show ONLY what is listed under Whitelist; everything else is hidden,
#               including commands of plugins you install later. A player still only sees
#               the commands they have permission for. A bare name does not allow its
#               namespaced form ("msg" does not show "essentials:msg").
# -------------------------------------------------------------------------------------
Tab_Complete:
  Enabled: true
  Bypass_Permission: chatalyst.bypass.tabcomplete
  Mode: hide
  # Only used with Mode: whitelist. Add the commands of your own plugins here.
  Whitelist:
    # Messaging and social
    - "msg"
    - "tell"
    - "w"
    - "r"
    - "reply"
    - "mail"
    - "inbox"
    - "ignore"
    - "helpop"
    - "report"
    # Travel
    - "spawn"
    - "tpa"
    - "tpaccept"
    - "tpdeny"
    - "tpahere"
    - "back"
    - "home"
    - "homes"
    - "sethome"
    - "delhome"
    - "warp"
    - "warps"
    # Economy
    - "bal"
    - "balance"
    - "money"
    - "pay"
    - "baltop"
    - "shop"
    - "market"
    - "ranks"
    # Utilities
    - "afk"
    - "rules"
    - "kit"
    - "kits"
    - "nick"
    - "nickcolor"
    - "chatcolor"
    - "tags"
    - "toggle"
    - "events"
    - "vote"
  Hide:
    # Server info commands (reveal version / plugin list)
    - "plugins"
    - "pl"
    - "about"
    - "version"
    - "ver"
    - "icanhasbukkit"
    - "help"
    - "?"
    # Performance / system info
    - "timings"
    - "tps"
    - "mspt"
    - "lag"
    - "gc"
    - "memory"
    - "entities"
    - "spark"
    - "seed"
    - "datapack"
    # Vanilla / server namespaces (all the /minecraft:, /bukkit: ... noise)
    - "minecraft:*"
    - "bukkit:*"
    - "spigot:*"
    - "paper:*"
    - "purpur:*"
    # Common plugin admin/info commands and namespaces
    - "luckperms:*"
    - "lp"
    - "placeholderapi:*"
    - "papi"
    - "vault:*"
    - "worldedit:*"
    - "we"
    - "worldguard:*"
    - "wg"
    - "fawe:*"
    - "viaversion:*"
    - "protocollib:*"
    - "spark:*"
    - "floodgate:*"
    - "geyser:*"
    - "discordsrv:*"
    - "essentials:*"
    - "parties:*"

# -------------------------------------------------------------------------------------
#  Vanilla messages: restyle Minecraft's own plain command feedback (/tp, /xp, /gamemode,
#  /give, /kill, /effect, /time...) with the plugin's look, in each client's language.
#  The templates live in lang/<locale>.yml under "vanilla:" — edit them freely, or set one
#  to "" to keep the vanilla text for that key.
#  Requires PacketEvents installed and PacketEvents.Enabled: true (integrations.yml):
#  these messages never reach Bukkit's API, only the network layer.
# -------------------------------------------------------------------------------------
Vanilla_Messages:
  Enabled: true
  # Vanilla keys to leave untouched, e.g. "commands.seed.success".
  Ignore: []

# -------------------------------------------------------------------------------------
#  Unknown command
#  Replaces Minecraft's red "Unknown or incomplete command ... <--[HERE]" with a styled
#  message (lang: unknown-command.*). Unknown, forbidden and hidden commands get the SAME
#  text, so it never reveals that a command exists. Suggest = offer the closest command
#  the player can actually use (clickable). Paper/Purpur only; no PacketEvents needed.
# -------------------------------------------------------------------------------------
Unknown_Command:
  Enabled: true
  Suggest: true

# -------------------------------------------------------------------------------------
#  Message replacements
#  Rewrites messages sent by OTHER plugins: the hardcoded line of a plugin with no language
#  file, or a prefix that gives away which plugin is installed.
#
#  Each rule has the message to recognise (Match) and what to send instead (Replace).
#    - Match is compared against the WHOLE message as plain text: its colours are ignored,
#      and a rule never fires on part of a longer line.
#    - %0%, %1%, %2%... capture whatever is in that spot and can be reused in Replace.
#    - %player% only matches the name of the player receiving the message.
#    - Replace accepts MiniMessage and & colour codes. Leave it empty ("") to hide the
#      message completely.
#  Rules are tried in order and the first one that matches wins.
#  Requires PacketEvents installed and PacketEvents.Enabled: true (integrations.yml).
#
#  Example:
#    Rules:
#      - Match: "You do not have permission to use this command."
#        Replace: "<#C0B3D9>You cannot use that command."
#      - Match: "[SomePlugin] Teleporting to %0% in %1% seconds"
#        Replace: "<#C0B3D9>Travelling to <#FBF2FF>%0%<#C0B3D9> in <#B56CFF>%1%s"
#      - Match: "[SomePlugin] Checking for updates..."
#        Replace: ""
# -------------------------------------------------------------------------------------
Message_Replacements:
  Enabled: false
  Rules: []

# -------------------------------------------------------------------------------------
#  Server brand
#  The server software name the client shows on the F3 screen ("Paper", "Purpur"...).
#  Hiding /plugins and /version is of little use if F3 still says what the server runs.
#  & colour codes are supported. Players already online see the change after
#  /chatalyst reload; no relog needed.
#  Requires PacketEvents installed and PacketEvents.Enabled: true (integrations.yml).
# -------------------------------------------------------------------------------------
Server_Brand:
  Enabled: false
  Name: "Vanilla"
