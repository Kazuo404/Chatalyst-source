# =====================================================================================
#  Chatalyst — how a player is DISPLAYED: the name above their head and the tab list.
#
#  This is not an integration: it is Chatalyst drawing the player itself. It used to sit
#  in integrations.yml, where it was almost half the file while the actual third-party
#  hooks were under a tenth of it. Everything that decides how a name is rendered now
#  lives here, including the TAB hook at the bottom — whoever edits nametags needs it in
#  front of them, and that is the test that matters.
# =====================================================================================

# -------------------------------------------------------------------------------------
#  Nametag above the head (rank above the player). Uses scoreboard teams; disable it if
#  you already use another nametag plugin to avoid clashes.
#    Name_Color: the name itself can only be ONE solid color (Minecraft limit; hex and
#    gradients are rounded to the nearest vanilla color). {rank_color} takes it from the
#    rank prefix; {nick_color} takes it from the player's /nickcolor choice (falls back
#    to white if they have none). Leave empty to not touch the color.
#    Using TAB instead? Add %chatalyst_nickcolor% at the END of tagprefix in TAB's
#    groups.yml and the name above the head follows /nickcolor the same way.
# -------------------------------------------------------------------------------------
Nametag:
  Enabled: false
  Prefix: "{player_prefix}"
  Suffix: "{player_suffix}"
  Name_Color: "{rank_color}"
  Update_Interval: 30
  # Fancy floating nametag: replaces the vanilla name above the head with a floating text
  # that renders the FULL nick style — gradients, bold, italics — bypassing the one-solid-
  # color limit of classic nametags. Format accepts the usual placeholders.
  #   Without TAB, Chatalyst hides the vanilla name by itself. With TAB installed, also set
  #   scoreboard-teams -> invisible-nametags: true in TAB's config.yml, or the vanilla name
  #   shows behind the fancy one.
  #   Height raises the text above the head; Hide_Sneaking dims it while sneaking.
  Fancy:
    Enabled: false
    # {nametag_icon_left}/{nametag_icon_right}: iconos opcionales por jugador que flanquean
    # el tag (ej. un escudo de guardian), puestos con /nametagtitle. Vacios si no tiene.
    Format: "{nametag_icon_left}{player_prefix}{player_nick}{afk_tag}{nametag_icon_right}"
    Height: 0.3
    Update_Interval: 2
    Hide_Sneaking: true
    # Each player sees their OWN tag (third person, F5). With false only players holding
    # chatalyst.nametag.seeself (OP by default) do, and everyone else sees nothing above
    # their own head — Minecraft never shows you your own vanilla name either.
    Show_Own: true
    # Varias lineas, como UnlimitedNameTags. Lineas de ARRIBA a ABAJO, como se ven. Si la
    # lista tiene algo, sustituye a Format en el cartel flotante (el TAB y el chat animados
    # siguen usando Format: ahi solo cabe una linea).
    #   Admite {internos}, %PAPI%, MiniMessage y &-codes/&#hex. Cada linea se colorea por
    #   separado: una etiqueta sin cerrar no pasa a la linea siguiente.
    #   {player_nick} en cualquier linea recibe la animacion igual que en Format.
    #   ejemplo:
    #   Lines:
    #     - "%clan_tag%"
    #     - "{nametag_icon_left}{player_prefix}{player_nick}{afk_tag}{nametag_icon_right}"
    #     - "&7❤ %player_health_rounded%"
    Lines: []
    # Una linea que queda vacia (p. ej. sin clan) no ocupa sitio.
    Remove_Empty_Lines: true
    # Grupos por permiso, como UnlimitedNameTags: gana el PRIMERO de la lista cuyo
    # Permission tenga el jugador, asi que pon los rangos mas altos ARRIBA (un OP o alguien
    # con '*' tiene todos los permisos y cae siempre en el primero). Cada grupo puede
    # redefinir Lines y el aspecto; lo que no defina lo hereda de las claves de abajo.
    # Sin grupo que encaje -> Lines/aspecto generales. Un permiso nuevo se nota en el
    # siguiente refresco, sin reconectar.
    #   ejemplo:
    #   Groups:
    #     owner:
    #       Permission: "chatalyst.nametag.group.owner"
    #       Lines:
    #         - "&c&lOWNER"
    #         - "{player_prefix}{player_nick}"
    #       Background: {Enabled: true, Color: "#FF0000", Opacity: 255}
    #       Scale: 1.2
    #     vip:
    #       Permission: "chatalyst.nametag.group.vip"
    #       Shadow: true
    Groups: {}
    # Aspecto del cartel (tag y titulo). Los valores de fabrica son el aspecto de siempre.
    #   Background: caja detras del texto. Opacity 0-255 (0 = invisible, 255 = solido). En un
    #     grupo se define ENTERO (Enabled, Color y Opacity).
    #   Shadow: sombra del texto. See_Through: el cartel se ve a traves de las paredes.
    #   Scale: tamaño (1.0 = normal; de 0.1 a 10).
    #   Billboard: CENTER (siempre mira al jugador) | HORIZONTAL | VERTICAL | FIXED.
    #   View_Distance: hasta cuantos bloques se ve (64 = el alcance normal de Minecraft; el
    #     cliente lo multiplica ademas por su ajuste "Distancia de entidades").
    #   Sneak_Opacity: opacidad del texto al agacharse (necesita Hide_Sneaking). De -128 a
    #     127 como la da Minecraft: 127 = medio transparente, 70 = tenue, y de 4 a 25 el
    #     texto desaparece del todo. -1 = opaco (no atenuar).
    Background:
      Enabled: false
      Color: "#000000"
      Opacity: 64
    Shadow: false
    See_Through: false
    Scale: 1.0
    Billboard: CENTER
    View_Distance: 64
    Sneak_Opacity: 70
    # Un segundo renglon flotante ENCIMA del tag (ej. "REY DE TODO").
    #   Format: usa {nametag_title} (el titulo por jugador que pone /nametagtitle).
    #   Default_Format: respaldo cuando el jugador NO tiene titulo propio — util para
    #     titulos por rango con PlaceholderAPI, ej. "%luckperms_meta_nametag_title%".
    #   Height: separacion sobre el tag (mayor que Height del tag para que quede encima).
    #     Vale para UNA linea: con Lines el bloque crece hacia arriba, asi que el titulo se
    #     sube solo 0.25 * Scale por cada linea extra que se este mostrando (las vacias que
    #     Remove_Empty_Lines quita no cuentan). No hace falta recalcular Height a mano.
    Title:
      Enabled: false
      Format: "{nametag_title}"
      Default_Format: ""
      Height: 0.55
      Max_Length: 32
    # Animacion compartida por el tag flotante, TAB y el snapshot del apodo en chat. Mode:
    #   frames -> rota la lista Frames, un cuadro por Interval_Ticks (colores/texto alternos).
    #   wave   -> desliza un gradiente (Wave.Colors) sobre Wave.Content (efecto ola).
    # En chat cada linea captura el cuadro vigente al enviarse: una linea ya publicada no
    # puede seguir cambiando. TAB tiene un intervalo propio porque cada cambio se retransmite.
    # La animacion sustituye el COLOR de /nickcolor, pero conserva sus Styles (bold, italic...).
    Animation:
      Enabled: false
      Mode: "frames"
      Interval_Ticks: 6
      Tab_Interval_Ticks: 10   # minimo 6; subelo en redes grandes
      Apply_To:
        Tab: true              # requiere Tab_List.Enabled o TAB.Sync_Nick
        Chat: true             # snapshot vigente; no reenvia ni duplica mensajes
      Frames:
        - "<#FF4D6D>{player_nick}"
        - "<#E0AAFF>{player_nick}"
        - "<#3DFFA8>{player_nick}"
        - "<#B56CFF>{player_nick}"
      Wave:
        Content: "{player_nick}"
        Colors:
          - "#FFD700"
          - "#FF4D6D"
          - "#FFD700"
      # Animacion POR JUGADOR: cada uno elige un preset en /nickcolor -> Animados (o
      # queda estatico). Modo FLOW = bucle continuo y sin costura (la paleta es un
      # circulo de color que se desplaza en una sola direccion). SOLO anima el nametag
      # flotante y el titulo SOBRE LA CABEZA; el TAB y el chat muestran el degradado
      # ESTATICO (animar el TAB reenviaria el nombre a todos cada tick -> lag).
      # Interval_Ticks 2 = maxima fluidez del flotante.
      Per_Player: false
      Presets:
        rainbow:
          Mode: "flow"
          Interval_Ticks: 2
          Tab_Interval_Ticks: 2
          Icon: "NETHER_STAR"
          Display: "<rainbow>Arcoiris</rainbow>"
          Description: "Todo el arcoiris fluyendo"
          Wave:
            Content: "{player_nick}"
            Colors: ["#FF0000","#FF8000","#FFE600","#00E676","#00B0FF","#651FFF","#D500F9"]
        fire:
