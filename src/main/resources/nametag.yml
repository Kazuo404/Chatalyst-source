  # Prefijo del rango ANIMADO: {rank_anim} (fotograma del momento) en cualquier formato: el tag
  # flotante (Format: "{rank_anim}{player_nick}{afk_tag}"), el tab, el chat... {player_prefix} es el
  # prefijo fijo de LuckPerms (un solo fotograma). El fotograma sale de la hora, sin relojes: todos
  # los del mismo rango van sincronizados. Grupo sin animacion -> el prefijo fijo.
  #   Import_From_TAB: lee TAB/groups.yml (tagprefix "%animation:X%") y TAB/animations.yml.
  #   Groups: animaciones propias por grupo de LuckPerms; mandan sobre las importadas.
