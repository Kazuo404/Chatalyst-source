    Enabled: false
    Import_From_TAB: true
    Groups: {}
    # Ejemplo:
    #   nova:
    #     Interval_Ms: 100
    #     Frames: [":tag_nova_1:", ":tag_nova_2:"]

# -------------------------------------------------------------------------------------
#  Tab list (what you see when pressing TAB): name with rank + header/footer.
#  Name_Format accepts {player_prefix}, {player_name}, {player_suffix}, {ping},
#  and %papi% if you have PlaceholderAPI.
#    Connection quality: {ping_ms} shows the latency as a number colored by quality
#    ("23ms" in green, "320ms" in red), {ping_quality} shows a word (Excellent / Good /
#    Fair / Slow / Laggy), and {ping_bars} the classic signal bars (▰▰▰▱▱) if you
#    prefer them over the number.
# -------------------------------------------------------------------------------------
Tab_List:
  Enabled: false
  Name_Format: "{player_prefix}{rank_color}{player_name}{afk_tag}"
  Update_Interval: 10
  Header:
    - "<gradient:#240046:#9D4EDD:#E0AAFF>Your Server</gradient>"
    - ""
  Footer:
    - ""
    - "<#C0B3D9>Connection: {ping_ms} <#7B68A0>· {ping_quality}"

# -------------------------------------------------------------------------------------
#  TAB (NEZNAMY) integration. When TAB is installed, Chatalyst registers its placeholders
#  natively in TAB (no PlaceholderAPI needed): %chatalyst_nick% (with colors),
#  %chatalyst_nick_plain% (no effects), %chatalyst_channel%, %chatalyst_muted%,
#  %chatalyst_warnings%, %chatalyst_chatcolor%.
#    Sync_Nick: pushes /nick and its animation frames straight into TAB's tab list, so they
#    show up with zero TAB configuration. Set it to false if you prefer to control the name
#    yourself in TAB's config (e.g. customtabname: '%chatalyst_nick%').
#  Note: when TAB is present, the Chatalyst Tab_List and Nametag modules stay off to
#  avoid fighting over the tab list and scoreboard teams.
# -------------------------------------------------------------------------------------
TAB:
  Sync_Nick: true
