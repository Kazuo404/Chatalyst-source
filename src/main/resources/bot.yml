      Smart:
        Intro: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>See the richest players:"
        Intro_es: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>Mira los jugadores mas ricos:"
        Parts:
          - Needs: "baltop"
            Text: "<#C0B3D9>• Open the leaderboard with <#E0AAFF>/baltop<#C0B3D9>."
            Text_es: "<#C0B3D9>• Abre el ranking con <#E0AAFF>/baltop<#C0B3D9>."
        Unavailable: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>The money leaderboard isn't available right now."
        Unavailable_es: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>El ranking de dinero no esta disponible ahora mismo."
      To: player
    private-messages:
      Keywords:
