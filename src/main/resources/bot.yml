        Unavailable: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>Player messaging is turned off right now."
        Unavailable_es: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>La mensajeria entre jugadores esta apagada ahora mismo."
