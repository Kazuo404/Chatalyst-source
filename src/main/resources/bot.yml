# =====================================================================================
#  Chatalyst — automatic messages: rotating announcer and the smart FAQ chat bot.
# =====================================================================================

# -------------------------------------------------------------------------------------
#  Automatic rotating announcements
# -------------------------------------------------------------------------------------
Announcer:
  Enabled: true
  Interval: 300          # seconds between announcements
  Random: false          # true = random order
  # Smart mode: only announce when the chat is actually alive, so a quiet server is not
  # spammed. An announcement goes out only when, since the previous one, at least
  # Min_Chatters DIFFERENT players wrote in chat — or Chatters_Percent% of the online
  # players, whichever is higher — and at least Min_Players are online. Example: with
  # 100 players and 10%, 10 different chatters are needed; with 5 players the fixed
  # minimum (3) applies. When the chat is quiet, the announcement simply waits for a
  # later interval; nothing is lost.
  Smart:
    Enabled: true
    Min_Players: 2         # below this online count, never announce
    Min_Chatters: 3        # fixed minimum of different players chatting
    Chatters_Percent: 10   # ...or this % of online players, whichever is higher
  Prefix: "<#7B68A0>[<#B56CFF>Info<#7B68A0>] <reset>"
  # Title shown on "/broadcast toast <message>" (plain text; toasts don't support colors).
  Toast_Title: "Announcement"
  Toast_Title_es: "Anuncio"
  # Frames used by the "Frames" preset in /announce. Each entry is a full MiniMessage
  # template; {msg} inserts the composed announcement. Gradients and decorations work.
  # Interval_Ticks is clamped to 2..200. The selected palette style is intentionally
  # replaced by these per-frame templates while this preset is active.
  Animation:
    Interval_Ticks: 6
    Frames:
      - "<gradient:#240046:#7B2CBF>{msg}</gradient>"
      - "<gradient:#7B2CBF:#9D4EDD>{msg}</gradient>"
      - "<gradient:#9D4EDD:#C77DFF>{msg}</gradient>"
      - "<gradient:#C77DFF:#E0AAFF>{msg}</gradient>"
  # Announcements localize per viewer: an English client sees Messages, a Spanish client
  # sees Messages_es. The two lists are parallel BY INDEX (line 1 here = line 1 there); if a
  # Spanish line is missing, that viewer falls back to the English one. Console uses English.
  Messages:
    - "<#C0B3D9>Remember to respect other players."
    - "<#C0B3D9>Switch channels with <#FBF2FF>/channel<#C0B3D9>."
    - "<#C0B3D9>Send mail to anyone with <#FBF2FF>/inbox<#C0B3D9>."
  Messages_es:
    - "<#C0B3D9>Recuerda respetar a los demas jugadores."
    - "<#C0B3D9>Cambia de canal con <#FBF2FF>/channel<#C0B3D9>."
    - "<#C0B3D9>Envia correo a cualquiera con <#FBF2FF>/inbox<#C0B3D9>."

# -------------------------------------------------------------------------------------
#  Auto responses (chat bot): answer common questions automatically. Three ways to detect
#  a question (a response fires if ANY of them hits):
#    Triggers  - "contains" text or full regex ("regex:" prefix). Write both languages.
#    Keywords  - fuzzy detection for how people REALLY type. Each line is a group of
#                synonyms/stems separated by '|'; it fires when the message contains a word
#                from EVERY group. The message is normalized first: lowercased, accent-free,
#                de-leeted (din3r0 -> dinero), de-stretched (holaaaa -> hola) and punctuation
#                becomes spaces — so "komo gano din3ro!!!" still matches. Use short stems
#                (gan, consig, sac) to catch conjugations (gano, ganar, consigue, saco...).
#  Replies are MiniMessage lines chosen by each receiver's CLIENT language: Reply (English)
#  / Reply_es (Spanish) — if one list is missing, the other is used. {player} is the asker's
#  name. "To: player" answers only the asker; "To: everyone" broadcasts (each viewer sees
#  their own language). Cooldowns stop the bot from spamming: per player+response and global.
# -------------------------------------------------------------------------------------
Auto_Responses:
  Enabled: true                 # turn the whole FAQ bot on/off here
  Bypass_Permission: "chatalyst.bypass.autoresponse"
  # Auto_Language: each player gets the reply in THEIR client language (en/es). Set to false to
  # answer everyone in one fixed language (Language below).
  Auto_Language: true
  Language: "en"                # only used when Auto_Language is false ("en" or "es")
  # Private_Questions: a recognised question is NOT sent to the general chat — only the asker
  # sees their message and the bot's answer (in their language), keeping public chat clean.
  # Turn this off to keep questions public (then "To: everyone" responses broadcast as before).
  Private_Questions: true
  Player_Cooldown_Seconds: 60   # default per player+response (override per response)
  Global_Cooldown_Seconds: 10   # default per response for the whole server
  Delay_Ticks: 15               # short pause before answering, feels natural
  # -----------------------------------------------------------------------------------------
  #  SMART replies: a response can answer based on what the server ACTUALLY has, instead of a
  #  fixed line. Under "Smart", each Part shows only if its "Needs" capability is available now;
  #  the reply is composed from the available parts. If NONE apply, the "Unavailable" line is
  #  used ("not available right now"). A Part with NO "Needs" is unconditional: it is always
  #  said (use it for a line that does not depend on any plugin or feature). Needs can be:
  #    command:<cmd>   the command is registered (e.g. command:jobs, command:balance)
  #    plugin:<Name>   that plugin is installed and enabled (name as in /plugins)
  #    <native>        a Chatalyst feature switch: pm, mail, market, trade, channels,
  #                    announcements, economy, baltop, store (item deliveries are on),
  #                    ranks (the rank storefront), rent (renting perks with in-game
  #                    money is on, there is an economy AND at least one offer written),
  #                    discordlink (account linking is actually usable)
  #  Placeholders in reply text: {player} is the asker, {ranks_command} is whatever the
  #  storefront command is called right now (Tebex.Shop.Command).
  #  So "how do i see my money" only offers the balance command that exists, and "how do i pm"
  #  offers /msg and/or /inbox depending on which is on. A response can still use a plain
  #  Reply/Reply_es (with optional If_Plugin variants) when a fixed answer is enough.
  # -----------------------------------------------------------------------------------------
  Responses:
    # SMART example: only lists the ways to earn money that this server actually has.
    how-to-money:
      Keywords:
        - "dinero|plata|money|coin|coins|lana|feria|billete|cash|oro|eco|bucks|dosh|moolah|dough|rich"
        - "gan|consig|hag|hac|sac|junt|farm|earn|make|get|neces|need|wanna|gimme|grind|start"
      Triggers:
        - "how do i make money"
        - "how to earn money"
        - "regex:\\bc[oó]mo (gano|consigo|hago) (dinero|plata)\\b"
      Smart:
        Intro: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>Hi <#FBF2FF>{player}<#C0B3D9>, ways to earn money here:"
        Intro_es: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>Hola <#FBF2FF>{player}<#C0B3D9>, formas de ganar dinero aqui:"
        Parts:
          - Needs: "command:jobs"
            Text: "<#C0B3D9>• Work a job with <#E0AAFF>/jobs<#C0B3D9>."
            Text_es: "<#C0B3D9>• Trabaja un empleo con <#E0AAFF>/jobs<#C0B3D9>."
          - Needs: "command:shop"
            Text: "<#C0B3D9>• Buy and sell at <#E0AAFF>/shop<#C0B3D9>."
            Text_es: "<#C0B3D9>• Compra y vende en <#E0AAFF>/shop<#C0B3D9>."
          - Needs: "market"
            Text: "<#C0B3D9>• Sell your own items on <#E0AAFF>/market<#C0B3D9>."
            Text_es: "<#C0B3D9>• Vende tus propios items en <#E0AAFF>/market<#C0B3D9>."
          - Needs: "trade"
            Text: "<#C0B3D9>• Trade directly with <#E0AAFF>/trade <player><#C0B3D9>."
            Text_es: "<#C0B3D9>• Intercambia directo con <#E0AAFF>/trade <jugador><#C0B3D9>."
        Unavailable: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>There's no money system enabled on this server yet."
        Unavailable_es: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>Aun no hay un sistema de dinero activo en este servidor."
      To: player
    # SMART example: shows the balance command that exists — NOT /baltop (that's the rich list).
    see-balance:
      Keywords:
        - "dinero|plata|money|coin|lana|saldo|balance|cuenta|bucks|dosh"
        - "veo|ver|mir|revis|cuant|teng|tien|chec|see|view|check|have|much|wheres|hw much"
      Triggers:
        - "how do i see my money"
        - "how much money do i have"
        - "check my balance"
        - "regex:\\bc[oó]mo (veo|miro|checo|reviso) (mi )?(dinero|saldo|balance|plata)\\b"
      Smart:
        Intro: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>To check your balance:"
        Intro_es: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>Para ver tu saldo:"
        Parts:
          - Needs: "command:balance"
            Text: "<#C0B3D9>• Use <#E0AAFF>/balance<#C0B3D9>."
            Text_es: "<#C0B3D9>• Usa <#E0AAFF>/balance<#C0B3D9>."
          - Needs: "command:money"
            Text: "<#C0B3D9>• Or <#E0AAFF>/money<#C0B3D9>."
            Text_es: "<#C0B3D9>• O <#E0AAFF>/money<#C0B3D9>."
          - Needs: "command:bal"
            Text: "<#C0B3D9>• Or <#E0AAFF>/bal<#C0B3D9>."
            Text_es: "<#C0B3D9>• O <#E0AAFF>/bal<#C0B3D9>."
        Unavailable: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>This server doesn't have an economy set up."
        Unavailable_es: "<#7B68A0>[<#B56CFF>Bot<#7B68A0>] <#C0B3D9>Este servidor no tiene economia configurada."
      To: player
    # SMART example: only mentions the messaging that is actually on (/msg, offline /inbox, or both).
    richest-players:
      Keywords:
        - "rico|rich|dinero|money|top|baltop"
        - "quien|who|mas|most|rank|lista|list|leaderboard|top"
      Triggers:
