# =====================================================================================
#  Chatalyst — cajas de regalo.
#
#  Una caja es un ENVOLTORIO. No sabe de donde vino ni quien te la dio: la puede soltar un
#  kit, una rifa, la tienda o un comando. Lo unico que sabe es de que TIPO es, y ese tipo
#  decide que puede haber dentro.
#
#  COMO FUNCIONA
#  -------------------------------------------------------------------------------------
#   1) Se entrega. Con `/caja dar <jugador> <tipo> [cantidad]`, o metiendola dentro de
#      cualquier cosa que reparta objetos (ver EXPORTAR, abajo).
#
#   2) Se abre. Clic derecho, se gasta una, y sale UN premio de la tabla de su tipo.
#
#   3) El premio se tira AL ABRIR, no al fabricar la caja. Es lo que hace que retocar una
#      tabla de aqui cambie tambien lo que dan las cajas que ya estan en los cofres de los
#      jugadores. Al reves, cada retoque dejaria detras una capa de cajas viejas que
#      reparten lo de antes, y nadie podria decir que da una caja mirandola.
#
#  EL PESO NO ES UN PORCENTAJE
#  -------------------------------------------------------------------------------------
#  `Weight: 25` no significa 25%. Cada premio se reparte contra la SUMA de los pesos de su
#  caja, asi que anadir uno nuevo no obliga a recalcular los demas. El porcentaje real lo
#  calcula el plugin y lo escribe en el propio objeto, asi que el lore nunca miente: una
#  tabla escrita a mano que sume 97 no falla, solo engaña, y eso no se ve nunca.
#
#  Peso 0 = escrito pero no sale. Sirve para guardar un premio de temporada sin borrarlo.
#
#  LO QUE PONE LA CAJA POR FUERA
#  -------------------------------------------------------------------------------------
#  El lore se REGENERA cada vez que se fabrica una caja, y lista los premios de mas a menos
#  probable con su porcentaje de verdad. `Show_Contents: false` lo apaga si prefieres que
#  sea una sorpresa; `Max_Listed` corta la lista y anade "y N cosas mas".
#
#  EXPORTAR (meter la caja dentro de otro plugin)
#  -------------------------------------------------------------------------------------
#  Una caja es una cabeza con perfil y una marca interna: eso NO se escribe a mano en el
#  config de otro plugin. `/caja exportar <tipo> [cantidad]` la serializa con el propio
#  Bukkit y la deja en plugins/Chatalyst/exports/, lista para pegar donde haga falta (por
#  ejemplo, dentro de un kit de AdvancedKits para que ademas se VEA en su vista previa).
#
#  Cada texto de cara al jugador admite su pareja "_es" (Name/Name_es), que ve un cliente
#  en español. Sin traduccion se usa la clave base, para que un fichero a medio traducir
#  se lea como un idioma y no como una mezcla.
# =====================================================================================
Gifts:
  Enabled: true
  Command: "caja"
  Command_Aliases:
    - "cajas"
    - "giftbox"

  # Escribir en el lore lo que puede caer, con su probabilidad real.
  Show_Contents: true

  # Cuantos premios caben en esa lista antes de resumir con "y N cosas mas". Un lore de
  # veinte lineas tapa media pantalla y deja de leerse.
  Max_Listed: 8

  # Decirle por chat al jugador que le salio. Aparte del objeto, que ya lo ve en el
  # inventario: sin el mensaje, abrir diez cajas seguidas es un inventario que cambia solo.
  Announce: true

  # Sonido al abrir. Vacio = en silencio.
  Sound: ENTITY_PLAYER_LEVELUP

# =====================================================================================
