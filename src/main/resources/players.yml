# =====================================================================================
#  Chatalyst — player tools: private messages, mail, nick, tag, chat color, AFK, newcomer, spy.
# =====================================================================================

# -------------------------------------------------------------------------------------
#  AFK: marks a player away after some idle time (no move, chat or commands). Only the
#  player is told, privately — nothing is broadcast. The {afk_tag} placeholder shows the
#  status in the tab list (already in Tab_List.Name_Format), and %chatalyst_afk% is
#  available for PlaceholderAPI / TAB. /afk toggles it manually.
# -------------------------------------------------------------------------------------
Afk:
  Enabled: true
  Timeout_Seconds: 300
  Tab_Suffix: " <#C0B3D9>[AFK]"
  Notify: true
  # Watching is standing still. A vanished staff member spends the whole shift parked behind
  # somebody, and observer mode cancels most of what they do meanwhile, so those events never
  # counted as activity either: they went AFK precisely while working. Being hidden is, by
  # definition, not being away. Manual /afk still wins — this only stops it firing by itself.
  Ignore_Vanished: true

# -------------------------------------------------------------------------------------
#  Direct private messages (/msg, /reply, /ignore) — the owner's master switch.
#  Disabled by default: turn it on if you want live PMs on your server. Mail (/inbox)
#  is a separate system and keeps working either way, so with PMs off players still
#  write to each other through the mailbox. /spy is not affected (it also covers
#  commands, signs, books and anvils).
# -------------------------------------------------------------------------------------
Private_Messages:
  Enabled: false

# -------------------------------------------------------------------------------------
#  Mail notifications. Players get a clickable inbox message, actionbar, sound and an
#  advancement-style toast when new mail arrives or when they join with unread mail.
# -------------------------------------------------------------------------------------
Mail:
  # Master switch for the mailbox (/inbox). The code already honoured it, but the key was
  # missing from this file, so the only way to find it was to read the source.
  Enabled: true
  # Seconds a player must wait between sending two mails (own anti-spam; 0 disables).
  # Bypass with chatalyst.bypass.mailcooldown.
  Send_Cooldown_Seconds: 3
  # Maximum Unicode characters per message, for commands, chat compose, books and /msg
  # fallback alike. Bounded internally to 64..4096 so one mailbox cannot become a huge row.
  Max_Message_Length: 1024
  # Max messages kept per folder (inbox and spam) per player. When full, the OLDEST is
  # dropped as a new one arrives, so a mailbox can never grow without bound (which would
  # slow every send/read and let someone bloat storage). 0 or below = unlimited.
  Max_Messages: 100
  # Bridge with /msg — your choice as the owner; both systems stay independent either way.
  #   false (default): /msg and mail never interact. A /msg to someone with private
  #                    messages off is silently not delivered, exactly as before.
  #   true:            when the target turned PMs off with /toggle pm, the /msg is
  #                    delivered to their MAILBOX instead of being lost, and the sender
  #                    is told it went there. The mailbox rules still apply (the target's
  #                    receive-mail setting, blocked senders, spam folder and cooldown),
  #                    and /ignore stays silent and absolute: ignored players never reach
  #                    you, not even by mail.
  Msg_Fallback: false
  # Who lands in the INBOX rather than the spam folder. The code has always honoured this,
  # but the key was missing from this file, so the only way to find it was to read the source.
  #   false (default): anyone can write to your inbox — no need to add each other first.
  #   true:            mail from someone who is not your friend goes to SPAM instead. It is
  #                    not lost and it is not refused; it just does not interrupt you.
  Require_Friend: false
  Notifications:
    Enabled: true
    Toast: true
    Sound:
      Enabled: true
      Key: "minecraft:block.note_block.chime"
      Volume: 0.65
      Pitch: 1.35

# Personal /tag prefix and suffix (independent from the LuckPerms rank). Shown in chat
# via the {tag_prefix} / {tag_suffix} placeholders of the formats.
Tag:
  Max_Length: 16

# Nicknames (/nick). Maximum nickname length (excluding color codes).
Nick:
  Max_Length: 16
  # Apply the nickname as the player's Bukkit display name too, so other plugins that
  # print display names (join messages, teleport prompts, etc.) show the nick.
  Set_Display_Name: true
  # If EssentialsX is installed, mirror the nick (plain text) into its nickname system,
  # so Essentials commands like /tpa <nick> or /whois recognize the nick as well.
  Sync_Essentials: true
  # Replace real names with the plain nick in the tab-complete suggestions of EVERY
  # command (/tpa, /msg, /tp...), so /nick also hides the name from TAB. The rewritten
  # suggestion stays a valid argument (Sync_Essentials + Chatalyst commands resolve nicks).
  Tab_Complete_Nicks: true
  # Players with this permission keep seeing REAL names in tab suggestions (staff).
  Tab_Complete_Bypass: chatalyst.bypass.nicktab
  # Answer /list with the names players SEE, instead of letting Minecraft answer it.
  #
  # The vanilla command builds its line from the account name — it never looks at the display
  # name a nickname sets — so /list was the last place on the server where a real name still
  # came out whole, and /list uuids handed out the UUID with it. That is enough to undo a
  # /nick, and it undoes /anonymous completely. Whoever may use /realname is not intercepted:
  # they are allowed to resolve identities anyway. Turn this off only if another plugin owns
  # /list and already prints nicknames.
  #
  # The advancement announcement has the same problem and is fixed the same way, but with no
  # switch: nothing else owns that line, and a broadcast that names the account while chat, tab
  # and nametags all show the nickname was never a choice — it was the oversight.
  Hide_Real_Names_In_List: true
  # Names nobody may wear, as a nickname OR as a nametag title. This list is YOURS: your
  # staff, your server's brand. Chatalyst never rewrites it.
  #
  # The long shared list — Mojang, well-known creators, authority names like "Admin" —
  # lives in protected-names.txt next to this file. That one the plugin keeps up to date
  # on upgrade, which it could not do here without rewriting your configuration. Both
  # lists apply together.
  #
  # The impersonation check only sees accounts that have JOINED this server (it reads the
  # local usercache, never Mojang), which is why a curated list is needed at all. Matching
  # ignores case, spaces and look-alike characters, so "Ibai" also covers "ibai", "I b a i"
  # and full-width. A name never blocks its real owner, and players with
  # chatalyst.nick.impersonate skip the check entirely.
  Protected_Names:
    - DevKazuo
    - Chatalyst

# -------------------------------------------------------------------------------------
