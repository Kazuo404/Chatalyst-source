# =====================================================================================
#  Chatalyst - Swear filter (anti-evasion, multi-language)
#
#  Detects each word even if players try to bypass the filter with:
#    - Repetitions:   putooooo   -> puto
#    - Separators:    p.u.t.o / p u t o / p-u-t-o
#    - Leet speak:    put0 / @/4->a, 3->e, 1/!->i, 0->o, 5/$->s, 7->t ...
#    - Accents:       pútà, cúlö
#    - Homoglyphs:    Cyrillic lookalikes (pУt0 with 'а','е','о','р','с'...)
#    - Phonetic subs: k->c (kabron, marikon), v<->b/u (pvto, cavron), y->i, z->s
#    - CamelCase:     LaPutaDeTuMadre (a lower->UPPER transition counts as a word break)
#
#  It's "smart": it requires a WHOLE WORD, so it does NOT flag legit words that contain a
#  fragment (disputa, hermano, penetrar, cultura, class...). It only tolerates
#  separators/leet INSIDE the word.
#
#  For insults glued together in lowercase ("laputadetumadre") see the Contains list below.
#
#  Plurals and common variants are listed separately (word boundaries don't derive them).
# =====================================================================================

Enabled: true

# CENSOR = masks the letters (the message is sent censored).  DENY = cancels the message.
Action: CENSOR
Censor_Char: "*"
Points: 1
Use_Player_Language: true
Warn: "<#FF4D6D>Watch your language."
Warn_es: "<#FF4D6D>Cuida tu lenguaje."
Bypass_Permission: chatalyst.bypass.swear

# Alert staff (chatalyst.notify.security) when a player joins with an account name that
# trips this filter. It never kicks or blocks on its own: a false positive on a name would
# lock out a legit player, so the call is left to staff.
Name_Alert:
  Enabled: true

Normalize:
  Collapse_Repeats: true
  Strip_Separators: true
  # Leet also covers accents, Cyrillic homoglyphs and phonetic substitutions (k/c, v/b/u...).
  Leet: true
  # Treat a lowercase->UPPERCASE transition as a word boundary, so camelCase evasion like
  # "LaPutaDeTuMadre" is caught without flagging "Computadora" (no transition inside).
  Camel_Boundaries: true

