# Phrases matched ANYWHERE inside a word, with no word boundary, so insults glued together
# in lowercase are caught too: "laputadetumadre", "fuckyou", "eresungilipollas"...
# When one of these hits, the WHOLE word containing it is censored (or the message denied).
# Separators are NOT tolerated here on purpose: "tu madre" or "de puta madre" written with
# spaces are handled (or allowed) by the Words list above, not by this one.
# RULES to extend this list safely: only unambiguous fragments. Short or common fragments
# create false positives ("puta" here would flag "computadora"; "culo" would flag "vinculo").
Contains:
  # ---- Spanish ----
  - "tumadre"        # laputadetumadre, chingatumadre, conchatumadre, hijodetumadre...
  - "putamadre"
  - "putademadre"
  - "hijodeputa"
  - "hijadeputa"
  - "hijueputa"
  - "hijoeputa"
  - "gilipollas"
  - "chupapolla"
  - "pendejo"
  - "pendeja"
  - "mierda"         # comemierda, mierdero, unamierda...
  - "cabron"         # cabronazo, esuncabron...
  - "joder"
  - "malparido"
  # ---- English ----
  - "fuck"           # fuckyou, motherfucker, whatthefuck, dumbfuck...
  - "shit"           # bullshit, shithead, eatshit...
  - "bitch"          # sonofabitch, bitches...
  - "asshole"
  - "nigger"
  - "nigga"
  - "faggot"
  - "whore"
  - "slut"
  # ---- Portuguese ----
  - "caralho"
  - "filhodaputa"
  - "filhadaputa"
  - "vaisefoder"

# Exceptions: legit words that still match as a whole word and should NOT be touched
# (the Scunthorpe problem). With the smart word boundary they are rarely needed,
# but you can add the ones that cause false positives in your community.
Whitelist:
  - "ktm"    # motorbike brand; the k->c substitution would read it as "ctm"
