# =====================================================================================
#  Chatalyst - Preguntas en el chat / Chat quiz (chatgames.yml)
#
#  Cada cierto tiempo sale una pregunta. El primero que escribe la respuesta correcta gana
#  el premio de la DIFICULTAD de esa pregunta. Cada jugador la lee en el idioma de su
#  cliente (espanol o ingles) y vale responder en cualquiera de los dos.
#  Las respuestas se comparan sin tildes, sin mayusculas, sin signos y sin articulo delante;
#  los numeros se comparan como numeros (12 = 12.0 = 12,0).
#
#  /trivia                       ver la pregunta en el aire (todos)
#  /trivia iniciar [categoria]   lanzar una ya            (chatalyst.command.trivia.admin)
#  /trivia saltar                cancelarla sin premio    (chatalyst.command.trivia.admin)
#  /cht reload                   aplica los cambios de este archivo
# =====================================================================================

Chat_Games:
  Enabled: false
  # Mundos donde no se juega: quien este ahi no ve las preguntas ni puede ganar.
  Disabled_Worlds: []
  Command: trivia
  Command_Aliases: [pregunta, preguntas]
  # Minutos entre una pregunta y la siguiente (se sortea dentro del rango).
  Interval_Minutes: "8-15"
  # Jugadores conectados para que salgan solas (las de /trivia iniciar salen igual).
  Min_Players: 2
  # Segundos para responder; despues se dice la respuesta.
  Answer_Seconds: 60
  Question_Sound: BLOCK_NOTE_BLOCK_PLING
  Win_Sound: ENTITY_PLAYER_LEVELUP

  # Premio segun la dificultad de la pregunta (D: 1, 2 o 3 en cada pregunta; si no la
  # lleva, la Difficulty de su categoria). Commands = comandos de consola ({player}, {uuid}).
  Difficulties:
    1:
      Name: "<#7BFFB0>Fácil"
      Name_en: "<#7BFFB0>Easy"
      Money: 100
      Commands: []
      Reward_Text: "<#FFD166>100 Astrales"
      Reward_Text_en: "<#FFD166>100 Astrales"
    2:
      Name: "<#FFD166>Media"
      Name_en: "<#FFD166>Medium"
      Money: 250
      Commands: []
      Reward_Text: "<#FFD166>250 Astrales"
      Reward_Text_en: "<#FFD166>250 Astrales"
    3:
      Name: "<#FF4D6D>Difícil"
      Name_en: "<#FF4D6D>Hard"
      Money: 500
      Commands: []
      Reward_Text: "<#FFD166>500 Astrales"
      Reward_Text_en: "<#FFD166>500 Astrales"

  # Categorias. Weight = peso para el sorteo (0 = apagada). Difficulty = la de sus preguntas
  # que no digan otra. Generator: math_simple | math_complex = cuentas inventadas al vuelo.
  # Sin Generator, las preguntas salen de Chat_Game_Questions.<id de la categoria>.
  # Strict_Language: true = solo vale la respuesta en el idioma de quien contesta (traducciones).
  # Money/Commands/Reward_Text en una categoria solo se usan si no hay Difficulties.
  Categories:
    matematicas_simples: {Name: "<#7BFFB0>Matemáticas", Name_en: "<#7BFFB0>Math", Weight: 12, Difficulty: 1, Generator: math_simple, Money: 100, Reward_Text: "<#FFD166>100 Astrales", Reward_Text_en: "<#FFD166>100 Astrales"}
    matematicas_complejas: {Name: "<#54A6FF>Matemáticas avanzadas", Name_en: "<#54A6FF>Advanced math", Weight: 9, Difficulty: 2, Generator: math_complex, Money: 250, Reward_Text: "<#FFD166>250 Astrales", Reward_Text_en: "<#FFD166>250 Astrales"}
    quimica: {Name: "<#C77DFF>Química", Name_en: "<#C77DFF>Chemistry", Weight: 7, Difficulty: 2, Money: 250, Reward_Text: "<#FFD166>250 Astrales", Reward_Text_en: "<#FFD166>250 Astrales"}
    formulas: {Name: "<#FF7A9E>Fórmulas", Name_en: "<#FF7A9E>Formulas", Weight: 5, Difficulty: 2, Money: 250, Reward_Text: "<#FFD166>250 Astrales", Reward_Text_en: "<#FFD166>250 Astrales"}
    fisica: {Name: "<#FF9F1C>Física", Name_en: "<#FF9F1C>Physics", Weight: 7, Difficulty: 2, Money: 250, Reward_Text: "<#FFD166>250 Astrales", Reward_Text_en: "<#FFD166>250 Astrales"}
    geografia: {Name: "<#B6F7D4>Geografía", Name_en: "<#B6F7D4>Geography", Weight: 8, Difficulty: 1, Money: 100, Reward_Text: "<#FFD166>100 Astrales", Reward_Text_en: "<#FFD166>100 Astrales"}
    capitales: {Name: "<#B6F7D4>Capitales", Name_en: "<#B6F7D4>Capitals", Weight: 7, Difficulty: 1, Money: 100, Reward_Text: "<#FFD166>100 Astrales", Reward_Text_en: "<#FFD166>100 Astrales"}
    historia: {Name: "<#FFD166>Historia", Name_en: "<#FFD166>History", Weight: 7, Difficulty: 2, Money: 250, Reward_Text: "<#FFD166>250 Astrales", Reward_Text_en: "<#FFD166>250 Astrales"}
    biologia: {Name: "<#3DFFA8>Biología", Name_en: "<#3DFFA8>Biology", Weight: 7, Difficulty: 1, Money: 100, Reward_Text: "<#FFD166>100 Astrales", Reward_Text_en: "<#FFD166>100 Astrales"}
    astronomia: {Name: "<#D8B4FE>Astronomía", Name_en: "<#D8B4FE>Astronomy", Weight: 6, Difficulty: 2, Money: 250, Reward_Text: "<#FFD166>250 Astrales", Reward_Text_en: "<#FFD166>250 Astrales"}
    minecraft: {Name: "<#3DFFA8>Minecraft", Name_en: "<#3DFFA8>Minecraft", Weight: 9, Difficulty: 1, Money: 100, Reward_Text: "<#FFD166>100 Astrales", Reward_Text_en: "<#FFD166>100 Astrales"}
    tecnologia: {Name: "<#54A6FF>Tecnología", Name_en: "<#54A6FF>Technology", Weight: 5, Difficulty: 2, Money: 250, Reward_Text: "<#FFD166>250 Astrales", Reward_Text_en: "<#FFD166>250 Astrales"}
    deportes: {Name: "<#FF9F1C>Deportes", Name_en: "<#FF9F1C>Sports", Weight: 5, Difficulty: 1, Money: 100, Reward_Text: "<#FFD166>100 Astrales", Reward_Text_en: "<#FFD166>100 Astrales"}
    cultura: {Name: "<#E0AAFF>Arte y cultura", Name_en: "<#E0AAFF>Arts and culture", Weight: 5, Difficulty: 2, Money: 250, Reward_Text: "<#FFD166>250 Astrales", Reward_Text_en: "<#FFD166>250 Astrales"}
    idiomas: {Name: "<#FF7A9E>Idiomas", Name_en: "<#FF7A9E>Languages", Weight: 5, Difficulty: 1, Strict_Language: true, Money: 100, Reward_Text: "<#FFD166>100 Astrales", Reward_Text_en: "<#FFD166>100 Astrales"}

  # Textos (MiniMessage). "_en" = version en ingles. Marcadores: {category} {difficulty}
  # {question} {answer} {reward} {seconds} {player} {minutes}
  Messages:
    Question: "<#C44FE0><b>Pregunta</b> <#7B68A0>» <#C0B3D9>[{category}<#C0B3D9> · {difficulty}<#C0B3D9>] <#FBF2FF>{question} <#7B68A0>(responde en el chat · {seconds}s · premio: {reward}<#7B68A0>)"
    Question_en: "<#C44FE0><b>Question</b> <#7B68A0>» <#C0B3D9>[{category}<#C0B3D9> · {difficulty}<#C0B3D9>] <#FBF2FF>{question} <#7B68A0>(answer in chat · {seconds}s · prize: {reward}<#7B68A0>)"
    Winner: "<newline><#3DFFA8><b>¡RESPUESTA CORRECTA!</b> <#FBF2FF><b>{player}</b><#C0B3D9> acertó la pregunta.<newline><#C0B3D9>La respuesta era <#FFD166><b>{answer}</b><#C0B3D9> y se lleva {reward}<#C0B3D9>.<newline>"
    Winner_en: "<newline><#3DFFA8><b>CORRECT ANSWER!</b> <#FBF2FF><b>{player}</b><#C0B3D9> got it right.<newline><#C0B3D9>The answer was <#FFD166><b>{answer}</b><#C0B3D9>. Prize: {reward}<#C0B3D9>.<newline>"
    Timeout: "<#C44FE0><b>Pregunta</b> <#7B68A0>» <#C0B3D9>Nadie acertó. La respuesta era <#FBF2FF>{answer}<#C0B3D9>."
    Timeout_en: "<#C44FE0><b>Question</b> <#7B68A0>» <#C0B3D9>Nobody got it. The answer was <#FBF2FF>{answer}<#C0B3D9>."
    Current: "<#C44FE0><b>Pregunta</b> <#7B68A0>» <#C0B3D9>[{category}<#C0B3D9> · {difficulty}<#C0B3D9>] <#FBF2FF>{question} <#7B68A0>(quedan {seconds}s)"
    Current_en: "<#C44FE0><b>Question</b> <#7B68A0>» <#C0B3D9>[{category}<#C0B3D9> · {difficulty}<#C0B3D9>] <#FBF2FF>{question} <#7B68A0>({seconds}s left)"
    None: "<#C44FE0><b>Pregunta</b> <#7B68A0>» <#C0B3D9>Ahora no hay ninguna pregunta. La siguiente sale en unos <#FBF2FF>{minutes}<#C0B3D9> min."
    None_en: "<#C44FE0><b>Question</b> <#7B68A0>» <#C0B3D9>No question right now. The next one comes in about <#FBF2FF>{minutes}<#C0B3D9> min."
    Disabled: "<#FF4D6D>Las preguntas del chat están apagadas."
    Disabled_en: "<#FF4D6D>Chat questions are turned off."
    Started: "<#3DFFA8>Pregunta lanzada."
    Skipped: "<#3DFFA8>Pregunta cancelada."
    Busy: "<#FF4D6D>Ya hay una pregunta en marcha. Usa <#FBF2FF>/trivia saltar<#FF4D6D> primero."
    Unknown_Category: "<#FF4D6D>No existe la categoría <#FBF2FF>{category}<#FF4D6D>. Hay: {categories}"
    Usage: "<#C0B3D9>/trivia <#7B68A0>· <#C0B3D9>/trivia iniciar [categoría] <#7B68A0>· <#C0B3D9>/trivia saltar"

